# 감사·기도 나눔판 Worker — 배포: tools/share 폴더에서 `npx wrangler@4 deploy`
# 암호는 여기 넣지 않고 `npx wrangler@4 secret put CHURCH_CODE` / `ADMIN_CODE` 로 Cloudflare에 비밀로 저장
name = "ansanhatbit-share"
main = "share-worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "ansanhatbit-share"
database_id = "7f8fe81c-e8b9-44b2-b02f-70270068b711"
